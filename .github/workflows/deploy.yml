# Tests on every pull request, tests then deploy on every push to master.
#
# The test database is a container GitHub Actions creates empty at job start and destroys at job
# end: nothing persists between runs, which is the whole point (see
# docs/superpowers/plans/2026-08-18-cicd-ephemeral-test-db.md). The production Supabase project
# is never touched by tests — TapasSeed refuses to seed a database that carries tapas' own
# tables, so pointing this job at Supabase by accident fails loudly instead of writing there.
name: test and deploy

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    # Stacked pushes need only the newest test run. The deploy job below deliberately does NOT
    # cancel in progress.
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        # pgvector, not plain postgres: the RAG store needs the vector extension, and Supabase
        # runs Postgres 17.6, so matching both keeps the SQL dialect honest.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Plain values, not secrets: the container is reachable only from inside this job.
      DATABASE_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      SPRING_AI_PROVIDER: anthropic
      # The project URL, not a secret — it ships in any frontend that talks to the project. The
      # tests verify tokens against a local key, but the property has to resolve or no Spring
      # context starts at all.
      SUPABASE_URL: https://itmykooxrbrdbgqwsesb.supabase.co
      # No test calls a chat model, but the autoconfiguration needs the property non-empty.
      ANTHROPIC_API_KEY: not-used-no-test-calls-a-chat-model
      # Real, and genuinely used: the RAG tests embed for real (see IngestionIntegrationTest).
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Explicitly empty: the football-data sync logs and no-ops without a key, and that is the
      # intended behaviour here rather than an oversight.
      FOOTBALL_DATA_API_KEY: ""

    steps:
      - uses: actions/checkout@v7

      - name: Run pre-push shell regressions
        run: bash scripts/tests/pre-push-test.sh

      - name: Create the vector extension and load the tapas schema
        # Spring AI's PgVectorStore creates the extension itself at context start, so the first
        # statement is belt-and-braces. The dump is the six tables this project reads but does
        # not own; regenerate it with scripts/dump-test-schema.sh after any tapas migration.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -f backend/src/test/resources/db/tapas-schema.sql

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # There are no frontend unit tests; this build (check-contrast + tsc + vite) is the
      # frontend gate, and it fails fast before the slower backend suite.
      - name: Build the frontend
        working-directory: frontend
        env:
          # Not committed (see frontend/src/auth/supabaseClient.ts). The build refuses to run
          # without it, so this job also proves the secret is still set before a deploy needs it.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm ci
          npm run build

      - name: Run the backend suite
        working-directory: backend
        run: ./gradlew test

      # KAR-42: CI has shown an intermittent ConcurrentModificationException with no retained
      # evidence to diagnose it from. Upload on failure too (always(), not just success), without
      # touching the job's pass/fail status: a missing-report warning must never be mistaken for
      # the original test failure.
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: |
            backend/build/test-results/test/**
            backend/build/reports/tests/test/**
            backend/build/diagnostics/kar-42/**
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    # NOT cancel-in-progress: a flyctl deploy killed mid-run can leave a half-finished release.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Deploying restarts the single always-on machine. A deploy landing near 02:00 UK can make
      # that day's price capture miss its window; DailyPriceFreshnessCheck logs an ERROR the next
      # morning when it does.
      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --ha=false --remote-only \
            --build-arg VITE_SUPABASE_ANON_KEY="${{ secrets.VITE_SUPABASE_ANON_KEY }}"

      # An external check, deliberately: it proves the route serves, not merely that flyctl
      # returned. A JVM cold start on 512 MB takes tens of seconds, hence the retries.
      #
      # The custom domain rather than fly.dev, since 2026-08-28: that is the route the public
      # uses, and a deploy where fly.dev answers but fpl-sidekick.com does not is broken from
      # every user's point of view. This check is also what would catch a DNS or certificate
      # regression on the domain, which nothing else in the pipeline looks at.
      - name: Smoke test the deployed health endpoint
        run: |
          curl --fail --silent --show-error \
               --retry 10 --retry-delay 15 --retry-all-errors \
               https://fpl-sidekick.com/actuator/health
