name: Read-only chat incident diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/chat-incident-diagnostics.yml']

permissions:
  contents: read

jobs:
  logs:
    if: github.head_ref == 'investigate/chat-http-500'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read production status and recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          date -u
          flyctl status -a fpl-assistant
          flyctl machine status 8151d9a97e7538 -a fpl-assistant
          flyctl logs -a fpl-assistant --no-tail
      - name: Read request timestamps and trace metadata without message bodies
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a fpl-assistant -C 'sh -s' <<'SH'
          set -eu
          command -v openssl >/dev/null
          host='itmykooxrbrdbgqwsesb.supabase.co'
          get_metadata() {
            {
              printf 'GET %s HTTP/1.1\r\n' "$1"
              printf 'Host: %s\r\n' "$host"
              printf 'apikey: %s\r\n' "${SUPABASE_SERVICE_ROLE_KEY:?service key unavailable}"
              printf 'Authorization: Bearer %s\r\n' "$SUPABASE_SERVICE_ROLE_KEY"
              printf 'Accept: application/json\r\nConnection: close\r\n\r\n'
            } | timeout 20 openssl s_client -quiet -verify_return_error \
              -verify_hostname "$host" -servername "$host" -connect "$host:443" \
              | awk '/^HTTP\// { print; next } body { print; next } /^\r?$/ { body=1 }'
            printf '\n'
          }
          printf 'Gross-prefix user-message timestamps (no content):\n'
          get_metadata '/rest/v1/fpl_message?select=created_at,conversation_id&role=eq.user&content=ilike.Gro%2A&created_at=gte.2026-09-20T07:00:00Z&order=created_at.desc&limit=5'
          printf 'Recent trace timing/error metadata (no prompts or answers):\n'
          get_metadata '/rest/v1/fpl_chat_trace?select=conversation_id,created_at,completed_at,status:payload-%3E%3Estatus,error:payload-%3Eerror,round1_started:payload-%3EmodelRounds-%3E0-%3E%3EstartedAt,round1_duration_ms:payload-%3EmodelRounds-%3E0-%3E%3EdurationMs,round1_model:payload-%3EmodelRounds-%3E0-%3E%3Emodel,round1_error:payload-%3EmodelRounds-%3E0-%3Eerror,round2_duration_ms:payload-%3EmodelRounds-%3E1-%3E%3EdurationMs,round2_error:payload-%3EmodelRounds-%3E1-%3Eerror,tool1_name:payload-%3Etools-%3E0-%3E%3Ename,tool1_duration_ms:payload-%3Etools-%3E0-%3E%3EdurationMs,tool1_error:payload-%3Etools-%3E0-%3Eerror&created_at=gte.2026-09-20T07:00:00Z&order=created_at.desc&limit=10'
          SH
