name: Read-only chat incident diagnostics

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/chat-incident-diagnostics.yml']

permissions:
  contents: read

jobs:
  logs:
    if: github.head_ref == 'investigate/chat-http-500'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read production status and recent logs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          date -u
          flyctl status -a fpl-assistant
          flyctl machine status 8151d9a97e7538 -a fpl-assistant
          flyctl logs -a fpl-assistant --no-tail
      - name: Read only timing and error metadata for the reported Gross turn
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console -a fpl-assistant -C 'sh -s' <<'SH'
          set -eu
          command -v openssl >/dev/null
          host='itmykooxrbrdbgqwsesb.supabase.co'
          path='/rest/v1/fpl_chat_trace?select=created_at%2Ccompleted_at%2Cstatus%3Apayload-%3E%3Estatus%2Cerror%3Apayload-%3Eerror%2Cround1_started%3Apayload-%3EmodelRounds-%3E0-%3E%3EstartedAt%2Cround1_duration_ms%3Apayload-%3EmodelRounds-%3E0-%3E%3EdurationMs%2Cround1_model%3Apayload-%3EmodelRounds-%3E0-%3E%3Emodel%2Cround1_error%3Apayload-%3EmodelRounds-%3E0-%3Eerror%2Cround2_duration_ms%3Apayload-%3EmodelRounds-%3E1-%3E%3EdurationMs%2Cround2_error%3Apayload-%3EmodelRounds-%3E1-%3Eerror%2Ctool1_name%3Apayload-%3Etools-%3E0-%3E%3Ename%2Ctool1_duration_ms%3Apayload-%3Etools-%3E0-%3E%3EdurationMs%2Ctool1_error%3Apayload-%3Etools-%3E0-%3Eerror&created_at=gte.2026-09-20T08%3A14%3A00Z&payload-%3E%3EmodelRounds=ilike.%2AGross%3F%2A&order=created_at.desc&limit=5'
          {
            printf 'GET %s HTTP/1.1\r\n' "$path"
            printf 'Host: %s\r\n' "$host"
            printf 'apikey: %s\r\n' "${SUPABASE_SERVICE_ROLE_KEY:?service key unavailable}"
            printf 'Authorization: Bearer %s\r\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'Accept: application/json\r\nConnection: close\r\n\r\n'
          } | timeout 20 openssl s_client -quiet -verify_return_error \
            -verify_hostname "$host" -servername "$host" -connect "$host:443"
          SH
