plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'fi.karivanttinen'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Supabase signs its JWTs with an asymmetric key it publishes as a JWKS, so the backend
    // verifies locally and no shared secret exists anywhere.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.postgresql:postgresql'
    implementation 'org.springframework.ai:spring-ai-starter-model-anthropic'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    // Section-based markdown chunking for the strategy corpus (BOM-managed, 2.0.0).
    implementation 'org.springframework.ai:spring-ai-markdown-document-reader'
    // RFC 4180 CSV parsing for the vaastav historical-data import (fixtures.csv's `stats`
    // column is a quoted blob containing commas and quotes — split(",") corrupts every row).
    implementation 'org.apache.commons:commons-csv:1.14.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4 modularization: @WebMvcTest lives in its own test module
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // WebTestClient (MockMvcWebTestClient) for streaming SSE controller tests
    testImplementation 'org.springframework:spring-webflux'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform {
        // Tests tagged 'realdata' assert against tapas' fully-synced production tables (a whole
        // season of fixtures and clubs), which the ephemeral test database deliberately does not
        // carry. Run them by hand against Supabase with -PincludeRealData.
        if (!project.hasProperty('includeRealData')) {
            excludeTags 'realdata'
        }
    }
}
