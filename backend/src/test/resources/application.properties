# Default every test to the `test` profile, so the vector store points at
# fpl_embeddings_test even in test classes that have nothing to do with RAG.
#
# Without this, any @SpringBootTest without @ActiveProfiles("test") constructs a
# PgVectorStore aimed at the production fpl_embeddings and re-runs its CREATE EXTENSION /
# CREATE TABLE / CREATE INDEX DDL against the database shared with tapas-fpl-app. That is
# idempotent so it does no harm today, but it is DDL on a shared production database issued
# by tests that never asked for it — and it means a future test that writes is one missing
# annotation away from truncating the real corpus.
#
# Deliberately a .properties file, not application.yml: a test-classpath application.yml
# REPLACES the main one in Spring Boot 4.1 (dropping spring.datasource.url and everything
# else). A different extension merges instead of shadowing. Verified by running the suite.
spring.profiles.active=test
