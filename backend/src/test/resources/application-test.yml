# Test profile: pin the vector store to an isolated table so the ingestion tests can
# never truncate or refill the production fpl_embeddings corpus. This is a
# profile-specific file (activated via @ActiveProfiles("test")), NOT a second
# application.yml — Spring Boot 4.1 treats a same-named application.yml on the test
# classpath as REPLACING the main one, which silently drops spring.datasource.url and
# everything else. Profile-specific config merges with the base file instead.
#
# initialize-schema: true (inherited from application.yml) creates fpl_embeddings_test
# on first test boot, which is intended.
# Pinned away from the real project: every @SpringBootTest builds the real JwtDecoder bean, and
# a test that forgets its @Primary override would otherwise fetch production's JWKS.
supabase:
  url: http://127.0.0.1:1
  audience: authenticated

spring:
  ai:
    vectorstore:
      pgvector:
        table-name: fpl_embeddings_test

# Same reasoning as the vector store above: pl_match_result is never truncated, but a test
# writing to the production table would pollute it with fictitious matches permanently.
#
# startup-sync / scheduled are off here because background work must not run behind the suite.
# The startup runners fire on ApplicationReadyEvent in every Spring context the suite builds,
# and against an empty database their staleness check always says "stale" — so each context
# start would fetch the vaastav CSV over the network and read the shared player table while the
# tests are running. The daily-price scheduler is off for the same reason: a suite that happens
# to run at 02:00 UK would otherwise call FPL's API for real. All three classes are covered by
# tests that construct them directly.
fpl:
  historical:
    table-name: pl_match_result_test
    startup-sync: false
  price:
    table-name: fpl_player_price_test
    startup-sync: false
  chat:
    # Small on purpose: the suite proves that a history too large to send is trimmed and that the
    # user is told, and seeding 800k characters to reach the real budget would prove the same
    # thing slower. Every other test's messages are far below this.
    history-char-budget: 400
  user:
    # Pinned off the live API for the same reason the syncs are off: a test that forgets to mock
    # the lookup must fail locally, not call fantasy.premierleague.com from CI. Port 1 refuses
    # connections immediately.
    entry-url: http://127.0.0.1:1/entry/%d/
    profile-table-name: fpl_user_profile_test
    conversation-table-name: fpl_conversation_test
    message-table-name: fpl_message_test
    usage-table-name: fpl_usage_event_test
    invite-redemption-table-name: fpl_invite_redemption_test
  invite:
    # A code the suite can present, and a cap two rows away rather than thirty. Production sets
    # neither: an unset INVITE_CODE closes sign-up, which is the safe default.
    code: test-invite-code
    max-accounts: 2
  daily-price:
    table-name: fpl_daily_price_test
    scheduled: false
