spring:
  task:
    scheduling:
      # Two threads so the 02:00 capture and the 06:00/12:00/18:00 freshness checks cannot
      # block each other on the default single-thread scheduler — a hung capture must not
      # also silence the alert that watches for a hung capture.
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Supabase transaction pooler breaks pgjdbc's named server-side prepared
        # statements under concurrent load; disable statement promotion.
        prepareThreshold: 0
  ai:
    model:
      # Activates only the selected provider's chat autoconfiguration, so the
      # unused provider's missing API key can't fail context startup.
      chat: ${SPRING_AI_PROVIDER:anthropic}
      # Gated separately from chat above so provider switching stays predictable: RAG
      # embeddings always use OpenAI regardless of SPRING_AI_PROVIDER, because Anthropic
      # has no embeddings API.
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          # Response cap on the open endpoint — request caps live in ChatController.
          max-tokens: ${FPL_MAX_TOKENS:1500}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-5.6-terra
          # gpt-5.x rejects the legacy max_tokens parameter.
          max-completion-tokens: ${FPL_MAX_TOKENS:1500}
          # gpt-5.6 on /v1/chat/completions only supports function tools with reasoning off.
          reasoning-effort: none
      embedding:
        model: text-embedding-3-small
    vectorstore:
      pgvector:
        table-name: fpl_embeddings
        # Left unset, dimension resolution makes a live OpenAI call at every context startup.
        dimensions: 1536
        # CREATE EXTENSION/CREATE TABLE IF NOT EXISTS — idempotent, safe on every startup.
        initialize-schema: true
        # NOT enabled: PgVectorStore.afterPropertiesSet() runs schema validation
        # unconditionally BEFORE initialize-schema's table creation, so the two together
        # can never succeed from an empty table — validation always fails first. Verified
        # against the 2.0.0 bytecode, not merely observed. initialize-schema's own
        # CREATE TABLE is the only guard in effect.

# Supabase Auth. SUPABASE_URL is the project URL (https://<ref>.supabase.co); it is not a
# secret — it appears in every frontend that talks to the project.
supabase:
  issuer: ${SUPABASE_URL}/auth/v1
  jwks-uri: ${SUPABASE_URL}/auth/v1/.well-known/jwks.json
  # The audience Supabase puts in every access token it issues.
  audience: authenticated

fpl:
  ai:
    provider: ${SPRING_AI_PROVIDER:anthropic}
  historical:
    table-name: pl_match_result
    # Runs StartupSyncRunner on ApplicationReadyEvent. Off under the test profile so background
    # syncing never runs behind the suite.
    startup-sync: true
    football-data-api-key: ${FOOTBALL_DATA_API_KEY:}
    # Startup sync (StartupSyncRunner) re-syncs the in-progress season when the most recent
    # football-data row is older than this. 20h keeps a daily-ish cadence without syncing on
    # every restart during active development.
    sync-stale-after-hours: 20
  price:
    table-name: fpl_player_price
    # Runs StartupPriceSyncRunner on ApplicationReadyEvent; off under the test profile.
    startup-sync: true
    # Startup price sync (StartupPriceSyncRunner) snapshots player.now_cost and pulls the
    # current-season vaastav merged_gw.csv when the last snapshot is older than this. 6h keeps
    # roughly twice-daily cadence during the season without hitting vaastav on every boot.
    sync-stale-after-hours: 6
  user:
    # Phase 5a. Names are properties for the same reason every other table's is: the test
    # profile pins them to isolated copies. fpl_user_profile is NOT app_user — tapas owns that
    # name in this database.
    profile-table-name: fpl_user_profile
    conversation-table-name: conversation
    message-table-name: message
    usage-table-name: usage_event
  daily-price:
    table-name: fpl_daily_price
    # FPL's own bootstrap-static. Read-only, unauthenticated, and the only source in this
    # project that carries the price as it stands today: vaastav publishes end-of-gameweek
    # prices, and the tapas player table is synced weekly.
    bootstrap-url: https://fantasy.premierleague.com/api/bootstrap-static/
    # FPL applies price changes once a day at 00:00 UK (moved from ~01:30 for 2026/27 —
    # premierleague.com/en/news/4680462). 02:00 UK leaves two hours for the change to settle
    # and for any late-running FPL job to finish, per the owner's instruction.
    fetch-at: "0 0 2 * * *"
    fetch-zone: Europe/London
    # Freshness alert (DailyPriceFreshnessCheck): logs ERROR when the capture misses a day —
    # the capture writes one row per UK date at 02:00, so by 06:00 a row must exist for the
    # current UK date. Runs after the capture window; silent while healthy.
    check-at: "0 0 6,12,18 * * *"
    # Enabled 2026-08-18. Depends on the Fly machine staying up (min_machines_running = 1,
    # auto_stop_machines = false in fly.toml): a stop-when-idle machine has nothing running at
    # 02:00 to fire the cron, so reverting that setting stops the price capture — loudly now,
    # because the freshness check above surfaces the miss as an ERROR. Gates the capture AND
    # the freshness check.
    scheduled: true

cors:
  # Dev origins included so the Vite dev server (any local port) can talk to this backend
  # through the proxy without a CORS 403: the proxy forwards the browser's Origin header.
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
