spring:
  mvc:
    # Without this, Spring Boot strips the reason from every ResponseStatusException
    # (server.error.include-message defaults to NEVER) and the client sees a bare status. The
    # difference between "FPL does not know that team" and "FPL could not be reached" then exists
    # only in our source code, which is no use to the person reading the screen.
    problemdetails:
      enabled: true
  task:
    scheduling:
      # Two threads so the 02:00 capture and the 06:00/12:00/18:00 freshness checks cannot
      # block each other on the default single-thread scheduler — a hung capture must not
      # also silence the alert that watches for a hung capture.
      pool:
        size: 2
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Supabase transaction pooler breaks pgjdbc's named server-side prepared
        # statements under concurrent load; disable statement promotion.
        prepareThreshold: 0
  ai:
    model:
      # Activates only the selected provider's chat autoconfiguration (anthropic,
      # openai or google-genai), so the unused providers' missing API keys can't
      # fail context startup.
      chat: ${SPRING_AI_PROVIDER:anthropic}
      # Gated separately from chat above so provider switching stays predictable: RAG
      # embeddings always use OpenAI regardless of SPRING_AI_PROVIDER, because Anthropic
      # has no embeddings API.
      embedding: openai
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          # Response cap on the open endpoint — request caps live in ChatController.
          max-tokens: ${FPL_MAX_TOKENS:1500}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-5.6-terra
          # gpt-5.x rejects the legacy max_tokens parameter.
          max-completion-tokens: ${FPL_MAX_TOKENS:1500}
          # gpt-5.6 on /v1/chat/completions only supports function tools with reasoning off.
          reasoning-effort: none
      embedding:
        model: text-embedding-3-small
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          # Env-swappable because the trial compares depths and point releases without a
          # rebuild — docs/LLM-PRICING.md, "The trial, before any decision", step 2.
          model: ${GEMINI_MODEL:gemini-3.8-flash}
          max-output-tokens: ${FPL_MAX_TOKENS:1500}
          # Applies to the visible answer; thinking tokens are budgeted separately by the
          # level below and land on the bill as output tokens all the same.
          # LOW to start: the cost model in docs/LLM-PRICING.md assumes ~1,500 thinking
          # tokens/turn, and the trial raises this only if answers need it.
          thinking-level: ${GEMINI_THINKING_LEVEL:LOW}
    vectorstore:
      pgvector:
        table-name: fpl_embeddings
        # Left unset, dimension resolution makes a live OpenAI call at every context startup.
        dimensions: 1536
        # CREATE EXTENSION/CREATE TABLE IF NOT EXISTS — idempotent, safe on every startup.
        initialize-schema: true
        # NOT enabled: PgVectorStore.afterPropertiesSet() runs schema validation
        # unconditionally BEFORE initialize-schema's table creation, so the two together
        # can never succeed from an empty table — validation always fails first. Verified
        # against the 2.0.0 bytecode, not merely observed. initialize-schema's own
        # CREATE TABLE is the only guard in effect.

# Supabase Auth. SUPABASE_URL is the project URL (https://<ref>.supabase.co); it is not a
# secret — it appears in every frontend that talks to the project.
supabase:
  # Defaulted, not required: an unset SUPABASE_URL took production down on 2026-08-19 —
  # PlaceholderResolutionException at startup, every deploy since red, health check critical.
  # The project URL is not a secret (it ships in any frontend), so the default is the honest
  # value rather than a placeholder that fails later and less clearly.
  url: ${SUPABASE_URL:https://example-project.supabase.co}
  issuer: ${supabase.url}/auth/v1
  jwks-uri: ${supabase.url}/auth/v1/.well-known/jwks.json
  # The audience Supabase puts in every access token it issues.
  audience: authenticated
  # Creates accounts through the Admin API, and bypasses row-level security entirely: the same
  # handling class as the database password — backend only, never logged, never in anything the
  # frontend build can reach. Empty by default so a deploy without it closes sign-up rather than
  # failing to start; an unset SUPABASE_URL took production down on 2026-08-19, and unlike that
  # one this property has a working answer for "unset".
  service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

fpl:
  owned-sync:
    # Ownership never activates implicitly. STAGING may fetch and validate into owned staging
    # tables; only guarded ACTIVE can publish core/capture/PFS rows.
    mode: ${OWNED_SYNC_MODE:OFF}
    playing-season: ${OWNED_SYNC_PLAYING_SEASON:}
    cutover-confirmed: ${OWNED_SYNC_CUTOVER_CONFIRMED:false}
    importer:
      # Opt-in hourly incremental collector; requires an already-ACTIVE matching runtime and cutover confirmation.
      enabled: ${OWNED_SYNC_IMPORTER_ENABLED:false}
    handoff:
      # Operator-only OFF -> importer epoch and explicit rollback. Never acts at startup.
      enabled: ${OWNED_SYNC_HANDOFF_ENABLED:false}
    fixture-table-name: fpl_fixture_sync
    evidence-table-name: fpl_player_fixture_evidence
    alerts:
      # Outbox rows are still persisted when disabled/unconfigured, with an explicit state.
      # The URL is an owner secret supplied only through the environment and must be HTTPS.
      # Explicit alternative: the external monitor owns DOWN/recovery notifications.
      via-monitor: ${OWNED_SYNC_ALERTS_VIA_MONITOR:false}
      webhook-enabled: ${OWNED_SYNC_ALERT_WEBHOOK_ENABLED:false}
      webhook-url: ${OWNED_SYNC_ALERT_WEBHOOK_URL:}
    ops:
      # Dedicated operator surface; never authenticated by a chat-user JWT.
      enabled: ${OWNED_SYNC_OPS_ENABLED:false}
      token: ${OWNED_SYNC_OPERATOR_TOKEN:}
    external-health:
      # Minimal DB-heartbeat signal for an external monitor. Default closed and absent.
      enabled: ${OWNED_SYNC_EXTERNAL_HEALTH_ENABLED:false}
      token: ${OWNED_SYNC_MONITOR_TOKEN:}
  ai:
    provider: ${SPRING_AI_PROVIDER:anthropic}
  trace:
    # One flexible JSON document per chat turn. The next unit wires chat execution into this
    # persistence boundary; until then the table and admin API remain empty.
    table-name: fpl_chat_trace
  historical:
    table-name: pl_match_result
    # Runs StartupSyncRunner on ApplicationReadyEvent. Off under the test profile so background
    # syncing never runs behind the suite.
    startup-sync: true
    football-data-api-key: ${FOOTBALL_DATA_API_KEY:}
    # Startup sync (StartupSyncRunner) re-syncs the in-progress season when the most recent
    # football-data row is older than this. 20h keeps a daily-ish cadence without syncing on
    # every restart during active development.
    sync-stale-after-hours: 20
  price:
    table-name: fpl_player_price
    # Runs StartupPriceSyncRunner on ApplicationReadyEvent; off under the test profile.
    startup-sync: true
    # Startup price sync (StartupPriceSyncRunner) snapshots player.now_cost and pulls the
    # current-season vaastav merged_gw.csv when the last snapshot is older than this. 6h keeps
    # roughly twice-daily cadence during the season without hitting vaastav on every boot.
    sync-stale-after-hours: 6
  quota:
    # The free tier's allowance inside one gameweek window — from one deadline to the next of the
    # same season — and the fallback for every account with no override in
    # fpl_user_profile.weekly_message_limit, which is almost all of them. NULL there means this,
    # -1 unlimited, 0 suspended. Unlike the paid limit Phase 5b adds beside it, this number is
    # public: it is the offer, and it is on the marketing page either way.
    free-messages-per-gameweek: ${QUOTA_FREE_MESSAGES_PER_GAMEWEEK:20}
    # The allowance for the gap between two seasons: one window from a season's last deadline to
    # the next season's first, not a weekly reset. Larger because the gap is months long.
    free-messages-off-season: ${QUOTA_FREE_MESSAGES_OFF_SEASON:100}
  invite:
    # There is no shared code any more. Codes are rows in fpl_invite_code, each with its own
    # ceiling, benefit and validity window; an empty table refuses every sign-up, which is the
    # same safe default the missing secret used to give. Issue one with --create-invite-code.
    # The hard ceiling on accounts created through /api/auth/signup, and the number the free
    # tier's cost ceiling is drawn against (30 x 20 messages a week is about EUR 38/month). A
    # property so the owner can move it without a deploy.
    max-accounts: ${INVITE_MAX_ACCOUNTS:30}
  admin:
    # Who may call /api/admin/** — JWT sub ids, comma-separated. Empty (the default) means
    # nobody, which is the safe default: an unset secret closes the admin API rather than
    # opening it. Set with `fly secrets set ADMIN_USER_IDS=<uuid>`; the owner's sub is the id
    # column of the user in Supabase -> Authentication -> Users.
    user-ids: ${ADMIN_USER_IDS:}
  shortlist:
    # Immutable identity catalogues are shared evidence derived from daily captures; the
    # shortlist table is account-owned desired state validated against that evidence.
    catalogue-table-name: fpl_player_catalogue
    catalogue-player-table-name: fpl_player_catalogue_player
    catalogue-alias-table-name: fpl_player_catalogue_alias
    table-name: fpl_player_shortlist
  user:
    # Phase 5a. Names are properties for the same reason every other table's is: the test
    # profile pins them to isolated copies. fpl_user_profile is NOT app_user — shared owns that
    # name in this database.
    invite-code-table-name: fpl_invite_code
    profile-table-name: fpl_user_profile
    conversation-table-name: fpl_conversation
    message-table-name: fpl_message
    usage-table-name: fpl_usage_event
    # The invite ledger: one row per account created through POST /api/auth/signup, and the
    # count the account cap is checked against.
    invite-redemption-table-name: fpl_invite_redemption
    # Checked when a user saves their team id. A documented exception to "external APIs only at
    # sync time": this is a user-initiated write, not the chat path.
    entry-url: https://fantasy.premierleague.com/api/entry/%d/
  myteam:
    # Squad-aware advice. A documented exception to "external APIs only at sync time", like the
    # team-id check above: a manager's squad is per user and per gameweek, so there is nothing to
    # pre-sync. The entry URL is the one the team-id check already uses.
    entry-url: ${fpl.user.entry-url}
    # FPL publishes picks only for a gameweek whose deadline has passed.
    picks-url: https://fantasy.premierleague.com/api/entry/%d/event/%d/picks/
    # Chips already played; what is left is derived from bootstrap-static's windows.
    history-url: https://fantasy.premierleague.com/api/entry/%d/history/
    # Points scored so far in one gameweek, for every player at once. Read when the squad card
    # is built (KAR-15), cached per gameweek for cache-ttl-minutes, one call per turn at most.
    live-url: https://fantasy.premierleague.com/api/event/%d/live/
    standings-url: https://fantasy.premierleague.com/api/leagues-classic/%d/standings/?page_standings=%d
    # Squads, entries and standings age out fast enough that a transfer shows up within one
    # conversation, and slowly enough that a follow-up question costs nothing.
    cache-ttl-minutes: 5
    cache-max-entries: 500
    # bootstrap-static changes when prices do, once a day. Six hours keeps names, prices and
    # ownership honest without fetching a megabyte per conversation.
    bootstrap-ttl-minutes: 360
    # The whole turn's allowance, counted in a budget created per chat request. Ten opponents
    # plus the user's own squad fit inside it only because the entry response is cached.
    max-requests-per-turn: 15
    # Ten squads is what fits the budget; a bigger focus is clamped to it, and the reply says so.
    max-opponents: 10
  defcon:
    # Defensive contribution: 2 points for a defender reaching 10 clearances, blocks,
    # interceptions and tackles in a match, or a midfielder or forward reaching 12 including
    # recoveries. FPL added it for 2025/26; shared' player_fixture_stats predates the field, so
    # this project adds the columns and fills them. One request per player, from the same
    # element-summary endpoint shared reads for the rest of that table.
    element-summary-url: https://fantasy.premierleague.com/api/element-summary/{playerId}/
    # 03:00 UK, an hour after the price capture: this run takes minutes, and the price capture
    # is the one that cannot be repeated later.
    fetch-at: "0 0 3 * * *"
    fetch-zone: Europe/London
    scheduled: ${DEFCON_SCHEDULED:true}
    # Spacing between requests. ~600 players at 150ms is about a minute and a half of polite
    # traffic against a public API nobody is paying for.
    request-delay-ms: ${DEFCON_REQUEST_DELAY_MS:150}
  daily-price:
    table-name: fpl_daily_price
    # FPL's own bootstrap-static. Read-only, unauthenticated, and the only source in this
    # project that carries the price as it stands today: vaastav publishes end-of-gameweek
    # prices, and the shared player table is synced weekly.
    bootstrap-url: https://fantasy.premierleague.com/api/bootstrap-static/
    # FPL applies price changes once a day at 00:00 UK (moved from ~01:30 for 2026/27 —
    # premierleague.com/en/news/4680462). 02:00 UK leaves two hours for the change to settle
    # and for any late-running FPL job to finish, per the owner's instruction.
    fetch-at: "0 0 2 * * *"
    fetch-zone: Europe/London
    # Freshness alert (DailyPriceFreshnessCheck): logs ERROR when the capture misses a day —
    # the capture writes one row per UK date at 02:00, so by 06:00 a row must exist for the
    # current UK date. Runs after the capture window; silent while healthy.
    check-at: "0 0 6,12,18 * * *"
    # Enabled 2026-08-18. Depends on the Fly machine staying up (min_machines_running = 1,
    # auto_stop_machines = false in fly.toml): a stop-when-idle machine has nothing running at
    # 02:00 to fire the cron, so reverting that setting stops the price capture — loudly now,
    # because the freshness check above surfaces the miss as an ERROR. Gates the capture AND
    # the freshness check.
    scheduled: true

  schedule:
    gameweek-table-name: fpl_gameweek
    fixture-table-name: fpl_fixture
    # FPL's own fixture list: every fixture of the season with event, kickoff, difficulty and
    # scores. Gameweeks come from bootstrap-static's `events` block, already fetched for prices.
    fixtures-url: https://fantasy.premierleague.com/api/fixtures/
    # Ten minutes after the price capture, on the same clock and for the same reason: the
    # machine is up, FPL's overnight jobs have settled. Gameweek status is not read from this
    # capture's flags but derived from deadlines at the time of asking, so the cadence only
    # bounds how old scores and postponements can be.
    fetch-at: "0 10 2 * * *"
    fetch-zone: Europe/London
    # Freshness alert (ScheduleFreshnessCheck), same cadence and reasoning as the price one:
    # a silently dead capture must be an ERROR in the log, not an ageing provenance line.
    check-at: "0 0 6,12,18 * * *"
    scheduled: true

cors:
  # Dev origins included so the Vite dev server (any local port) can talk to this backend
  # through the proxy without a CORS 403: the proxy forwards the browser's Origin header.
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

management:
  endpoints:
    web:
      exposure:
        include: health

server:
  port: 8080
