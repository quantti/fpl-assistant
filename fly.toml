# Lives at the repo root so the Docker build context contains both backend/ and frontend/.
app = 'fpl-assistant'
# cdg (Paris): mad (Madrid) is deprecated and can no longer provision new machines (2026-08-15
# deploy error). flyctl launch originally registered the app at cdg anyway — the hand-correction
# of primary_region to mad in Phase 1 was only valid while mad still accepted new resources.
primary_region = 'cdg'
# Allow the durable epoch fence and bounded worker drain before forced termination.
kill_timeout = '60s'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep the single machine running: daily price and schedule captures use in-process
  # timers and cannot run while it is stopped (owner, 2026-09-12).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # Spring Boot cold start comfortably exceeds the plan's original 10s.
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/actuator/health'
    timeout = '5s'

[[vm]]
  # Continuous owned sync needs headroom beyond the web/LLM process (about 104 MiB free at 512 MiB).
  memory = '1gb'
  cpus = 1
