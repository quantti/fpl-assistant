# Lives at the repo root so the Docker build context contains both backend/ and frontend/.
app = 'fpl-assistant'
# cdg (Paris): mad (Madrid) is deprecated and can no longer provision new machines (2026-08-15
# deploy error). flyctl launch originally registered the app at cdg anyway — the hand-correction
# of primary_region to mad in Phase 1 was only valid while mad still accepted new resources.
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  # Pinned explicitly — flyctl defaults have shifted between versions. Machines stop when
  # idle; the first request after idle pays a JVM cold start (tens of seconds on 512MB).
  # Cold start is enabled for the time being (owner, 2026-09-07): the app is development-only
  # right now, so the wait is acceptable and the VM does not run 24/7. When the actual product
  # launches, remove it: auto_stop_machines = false, min_machines_running = 1 (that was the
  # setting 2026-08-18 → 2026-09-07, because the cold-start window caused client errors in the
  # frontend-vs-prod dev loop — requests during boot fail at the proxy after ~8s).
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    # Spring Boot cold start comfortably exceeds the plan's original 10s.
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/actuator/health'
    timeout = '5s'

[[vm]]
  memory = '512mb'
  cpus = 1
